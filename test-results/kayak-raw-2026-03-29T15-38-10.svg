<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg">

  <!-- Layer 1: Water Base (Dark Blue-Grey) -->
  <g id="water-base" data-name="Water Base" fill="#28313c">
    <rect x="0" y="0" width="1000" height="1500"/>
  </g>

  <!-- Layer 2: Water Mid-Tones (Blue-Grey) -->
  <g id="water-mid-tones" data-name="Water Mid-Tones" fill="#4a5766">
    <path d="M0 0 C300 100 700 50 1000 0 V1500 C700 1400 300 1450 0 1500 Z M0 700 C200 650 400 750 600 700 S800 600 1000 650 V1500 H0 Z M0 250 Q250 200 500 250 T1000 300 V0 H0 Z"/>
    <path d="M0 900 C150 880 300 950 450 900 S700 800 1000 850 V1500 H0 Z"/>
  </g>

  <!-- Layer 3: Water Lighter Tones (Light Blue-Grey) -->
  <g id="water-lighter-tones" data-name="Water Lighter Tones" fill="#6d7e8f">
    <path d="M0 0 C250 50 750 150 1000 100 V1500 C750 1450 250 1350 0 1400 Z M0 500 C180 470 360 550 540 500 S800 400 1000 450 V1500 H0 Z"/>
    <path d="M0 120 C100 100 200 150 300 120 S400 80 500 100 S600 150 700 120 S800 80 900 100 S1000 150 1000 150 V0 H0 Z"/>
    <path d="M0 800 C100 780 200 850 300 820 S400 780 500 800 S600 850 700 820 S800 780 900 800 S1000 850 1000 850 V1500 H0 Z"/>
    <path d="M0 1300 C100 1280 200 1350 300 1320 S400 1280 500 1300 S600 1350 700 1320 S800 1280 900 1300 S1000 1350 1000 1350 V1500 H0 Z"/>
  </g>

  <!-- Layer 4: Golden Reflection Base (Dark Orange) -->
  <g id="golden-reflection-base" data-name="Golden Reflection Base" fill="#8f6b42">
    <path d="M700 0 C750 100 800 400 820 600 S850 900 800 1100 S700 1400 700 1500 H1000 V0 Z"/>
  </g>

  <!-- Layer 5: Golden Reflection Highlight (Light Orange) -->
  <g id="golden-reflection-highlight" data-name="Golden Reflection Highlight" fill="#e8c47f">
    <path d="M750 0 C780 80 810 350 830 550 S860 850 810 1050 S750 1350 750 1500 H850 V0 Z M880 0 C900 50 920 300 930 500 S940 800 910 1000 S880 1200 880 1500 H1000 V0 Z"/>
  </g>

  <!-- Layer 6: Kayak Shadow / Dark Wake (Dark Red) -->
  <g id="kayak-shadow-dark-wake" data-name="Kayak Shadow / Dark Wake" fill="#990000">
    <!-- Darker part of wake -->
    <path d="M400 1000 C350 1050 300 1150 280 1250 C270 1350 280 1450 350 1500 H650 C720 1450 730 1350 720 1250 C700 1150 650 1050 600 1000 Z"/>
    <path d="M350 1100 C320 1150 300 1200 300 1250 C300 1300 320 1350 350 1400 H650 C680 1350 700 1300 700 1250 C700 1200 680 1150 650 1100 Z"/>
    <!-- Shadow on kayak -->
    <path d="M500 650 C520 600 550 500 570 450 L560 440 C540 490 510 590 490 640 Z"/>
    <path d="M500 650 C520 700 550 800 570 850 L560 860 C540 810 510 710 490 660 Z"/>
  </g>

  <!-- Layer 7: Kayak Body (Main Red) -->
  <g id="kayak-body" data-name="Kayak Body" fill="#ff0000">
    <path d="M490 440 C470 380 450 300 470 200 C490 100 550 100 570 200 C590 300 570 380 550 440 L550 860 C570 920 590 1000 570 1100 C550 1200 490 1200 470 1100 C450 1000 470 920 490 860 Z"/>
  </g>

  <!-- Layer 8: Person's Dark Details / Paddle (Dark Grey) -->
  <g id="person-dark-details-paddle" data-name="Person's Dark Details / Paddle" fill="#333333">
    <!-- Paddle -->
    <path d="M350 700 L300 680 L250 700 L270 720 L320 740 L370 720 Z"/>
    <path d="M650 700 L700 680 L750 700 L730 720 L680 740 L630 720 Z"/>
    <path d="M370 720 L630 720 L620 730 L380 730 Z"/>
    <!-- Darker vest parts -->
    <rect x="470" y="600" width="100" height="50" rx="10" ry="10"/>
    <path d="M470 650 Q480 670 500 670 Q520 670 530 650 L530 620 L470 620 Z"/>
    <path d="M570 650 Q560 670 540 670 Q520 670 510 650 L510 620 L570 620 Z"/>
  </g>

  <!-- Layer 9: Person's Light Details (Light Grey) -->
  <g id="person-light-details" data-name="Person's Light Details" fill="#bfbfbf">
    <!-- Hat -->
    <path d="M500 500 C470 480 460 450 480 430 S520 420 550 440 S560 470 540 490 S510 510 500 500 Z"/>
    <ellipse cx="510" cy="450" rx="40" ry="25"/>
    <!-- Vest -->
    <path d="M460 550 C450 570 450 600 460 620 C470 640 490 650 500 650 C510 650 530 640 540 620 C550 600 550 570 540 550 C530 530 510 520 500 520 C490 520 470 530 460 550 Z"/>
    <path d="M470 600 Q480 620 500 620 Q520 620 530 600 L530 570 L470 570 Z"/>
    <path d="M570 600 Q560 620 540 620 Q520 620 510 600 L510 570 L570 570 Z"/>
  </g>

  <!-- Layer 10: Kayak Highlights / Vest Red Accent (Bright Red) -->
  <g id="kayak-highlights-vest-red-accent" data-name="Kayak Highlights / Vest Red Accent" fill="#ff3333">
    <!-- Kayak Highlights -->
    <path d="M480 450 C475 400 470 300 480 220 S500 150 520 160 S540 250 535 320 S520 400 510 450 Z"/>
    <path d="M480 850 C475 900 470 1000 480 1080 S500 1150 520 1140 S540 1050 535 980 S520 900 510 850 Z"/>
    <!-- Vest Red Accent -->
    <path d="M460 560 L440 580 L460 600 L480 580 Z"/>
    <path d="M540 560 L560 580 L540 600 L520 580 Z"/>
  </g>

</svg>