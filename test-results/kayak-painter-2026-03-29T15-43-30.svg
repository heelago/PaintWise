<svg width="100%" height="100%" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waterGradientBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B9FB8" />
      <stop offset="40%" stop-color="#4B7B9C" />
      <stop offset="100%" stop-color="#2E4A5C" />
    </linearGradient>
    <linearGradient id="goldenReflectionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0A060" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#DA6030" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#DA6030" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#F0A060" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="kayakRedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C03A2A" />
      <stop offset="50%" stop-color="#E04B3A" />
      <stop offset="100%" stop-color="#80281D" />
    </linearGradient>
    <linearGradient id="paddleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A4A4A" />
      <stop offset="50%" stop-color="#6F6A65" />
      <stop offset="100%" stop-color="#4A4A4A" />
    </linearGradient>
  </defs>

  <!-- Base water color and overall background -->
  <rect x="0" y="0" width="800" height="1200" fill="url(#waterGradientBase)" />

  <g id="water-base-sky-reflection">
    <!-- Broad, diffuse sky reflections on the water -->
    <rect x="0" y="0" width="800" height="600" fill="#7B9FB8" opacity="0.15" />
    <rect x="0" y="300" width="800" height="400" fill="#4B7B9C" opacity="0.1" />
    <rect x="0" y="100" width="800" height="300" fill="#E0DED7" opacity="0.05" />
    <!-- Cloud-like reflections, distorted by water -->
    <ellipse cx="200" cy="150" rx="150" ry="50" fill="#E0DED7" opacity="0.07" transform="rotate(5 200 150)"/>
    <ellipse cx="600" cy="250" rx="180" ry="60" fill="#E0DED7" opacity="0.06" transform="rotate(-8 600 250)"/>
    <ellipse cx="400" cy="400" rx="100" ry="40" fill="#DA6030" opacity="0.05" transform="rotate(10 400 400)"/>
    <ellipse cx="100" cy="500" rx="120" ry="45" fill="#4B7B9C" opacity="0.08" transform="rotate(-3 100 500)"/>
  </g>

  <g id="golden-hour-reflection">
    <!-- Main golden streak, appearing as a reflection -->
    <rect x="520" y="0" width="80" height="1200" fill="url(#goldenReflectionGradient)" opacity="0.7" />
    <!-- Wavy elements for shimmer within the reflection -->
    <path d="M500 0 Q530 50 500 100 T530 200 T500 300 T530 400 T500 500 T530 600 T500 700 T530 800 T500 900 T530 1000 T500 1100 T530 1200" stroke="#F0A060" stroke-width="20" fill="none" opacity="0.15"/>
    <path d="M540 0 Q570 50 540 100 T570 200 T540 300 T570 400 T540 500 T570 600 T540 700 T570 800 T540 900 T570 1000 T540 1100 T570 1200" stroke="#DA6030" stroke-width="15" fill="none" opacity="0.1"/>
    <!-- Additional overlapping rectangles for complex shimmer -->
    <rect x="530" y="50" width="60" height="100" fill="#F0A060" opacity="0.2" transform="rotate(2 530 50)"/>
    <rect x="515" y="200" width="70" height="150" fill="#DA6030" opacity="0.15" transform="rotate(-3 515 200)"/>
    <rect x="540" y="400" width="50" height="80" fill="#F0A060" opacity="0.25" transform="rotate(1 540 400)"/>
    <rect x="525" y="600" width="65" height="120" fill="#DA6030" opacity="0.18" transform="rotate(-2 525 600)"/>
    <rect x="535" y="800" width="55" height="90" fill="#F0A060" opacity="0.22" transform="rotate(4 535 800)"/>
  </g>

  <g id="water-texture-ripples-background">
    <!-- Subtle, distant ripples across the water, varying in color and opacity -->
    <g stroke="#4B7B9C" stroke-width="2" fill="none" opacity="0.1">
      <ellipse cx="100" cy="150" rx="80" ry="10" transform="rotate(5 100 150)"/>
      <ellipse cx="300" cy="250" rx="120" ry="15" transform="rotate(-8 300 250)"/>
      <ellipse cx="600" cy="100" rx="100" ry="12" transform="rotate(10 600 100)"/>
      <ellipse cx="700" cy="400" rx="90" ry="10" transform="rotate(-5 700 400)"/>
      <ellipse cx="250" cy="500" rx="110" ry="13" transform="rotate(3 250 500)"/>
      <ellipse cx="450" cy="700" rx="130" ry="18" transform="rotate(-7 450 700)"/>
      <ellipse cx="150" cy="850" rx="95" ry="11" transform="rotate(2 150 850)"/>
      <ellipse cx="750" cy="950" rx="105" ry="14" transform="rotate(-4 750 950)"/>
    </g>
    <!-- Darker, slightly more defined background ripples -->
    <g stroke="#2E4A5C" stroke-width="3" fill="none" opacity="0.08">
      <ellipse cx="200" cy="200" rx="100" ry="12" transform="rotate(-10 200 200)"/>
      <ellipse cx="500" cy="300" rx="150" ry="18" transform="rotate(15 500 300)"/>
      <ellipse cx="100" cy="600" rx="130" ry="16" transform="rotate(-5 100 600)"/>
      <ellipse cx="700" cy="750" rx="110" ry="13" transform="rotate(8 700 750)"/>
      <ellipse cx="350" cy="900" rx="140" ry="17" transform="rotate(-12 350 900)"/>
    </g>
  </g>

  <g id="kayak-and-kayaker">
    <!-- Kayak body, using simple polygons and a gradient for depth -->
    <polygon points="500,600 680,630 700,670 600,740 480,700" fill="url(#kayakRedGradient)" stroke="#80281D" stroke-width="3" />
    <polygon points="510,610 670,635 680,660 590,720 490,690" fill="#E04B3A" opacity="0.8" /> <!-- Lighter top surface -->
    <polygon points="500,600 510,610 490,690 480,700" fill="#80281D" opacity="0.5" /> <!-- Left edge shadow -->

    <!-- Kayaker's body (simplified with rectangles) -->
    <rect x="570" y="620" width="50" height="70" fill="#C03A2A" stroke="#80281D" stroke-width="2" transform="skewX(-10)"/>
    <rect x="565" y="630" width="60" height="40" fill="#F5F5F0" stroke="#6F6A65" stroke-width="1" transform="skewX(-10)"/> <!-- Life vest -->
    <rect x="570" y="635" width="50" height="20" fill="#C03A2A" opacity="0.8" transform="skewX(-10)"/> <!-- Life vest top accent -->

    <!-- Kayaker's head and hat (ellipses) -->
    <ellipse cx="590" cy="610" rx="25" ry="15" fill="#E0DED7" stroke="#6F6A65" stroke-width="1" transform="rotate(-10 590 610)" /> <!-- Hat brim -->
    <ellipse cx="590" cy="595" rx="15" ry="10" fill="#E0DED7" stroke="#6F6A65" stroke-width="1" transform="rotate(-10 590 595)" /> <!-- Hat crown -->
    <rect x="580" y="585" width="20" height="20" fill="#6F6A65" opacity="0.7" transform="rotate(-10 580 585)" /> <!-- Head/face shadow -->

    <!-- Paddle (rectangles and polygons) -->
    <rect x="530" y="630" width="130" height="8" fill="url(#paddleGradient)" transform="rotate(-15 530 630)" />
    <polygon points="520,620 535,628 530,635 515,627" fill="#4A4A4A" transform="rotate(-15 520 620)" /> <!-- Left blade -->
    <polygon points="650,625 665,633 660,640 645,632" fill="#4A4A4A" transform="rotate(-15 650 625)" /> <!-- Right blade -->
  </g>

  <g id="water-ripples-wake-foreground">
    <!-- Wake behind kayak, using paths for organic shapes -->
    <path d="M470,720 Q530,700 600,750 T700,850 T650,950 L630,960 L500,850 Q450,800 470,720 Z" fill="#2E4A5C" opacity="0.2"/>
    <path d="M480,710 Q540,690 610,740 T710,840 T660,940" stroke="#4B7B9C" stroke-width="4" fill="none" opacity="0.4"/>
    <path d="M490,700 Q550,680 620,730 T720,830 T670,930" stroke="#2E4A5C" stroke-width="3" fill="none" opacity="0.3"/>

    <!-- Paddle ripples, using circles -->
    <circle cx="500" cy="740" r="15" fill="none" stroke="#4B7B9C" stroke-width="2" opacity="0.5"/>
    <circle cx="500" cy="740" r="25" fill="none" stroke="#4B7B9C" stroke-width="1.5" opacity="0.3"/>
    <circle cx="670" cy="650" r="10" fill="none" stroke="#4B7B9C" stroke-width="2" opacity="0.4"/>
    <circle cx="670" cy="650" r="20" fill="none" stroke="#4B7B9C" stroke-width="1.5" opacity="0.2"/>

    <!-- General foreground ripples for texture -->
    <g stroke="#2E4A5C" stroke-width="2" fill="none" opacity="0.2">
      <ellipse cx="100" cy="1100" rx="150" ry="20" transform="rotate(5 100 1100)"/>
      <ellipse cx="400" cy="1050" rx="180" ry="25" transform="rotate(-8 400 1050)"/>
      <ellipse cx="700" cy="1150" rx="160" ry="22" transform="rotate(10 700 1150)"/>
    </g>
  </g>

  <g id="highlights-and-final-details">
    <!-- Kayak highlights, small bright elements -->
    <polygon points="505,605 520,608 515,615 500,612" fill="white" opacity="0.6"/>
    <rect x="650" y="630" width="20" height="5" fill="white" opacity="0.5" transform="rotate(-15 650 630)"/>
    <rect x="670" y="645" width="10" height="3" fill="white" opacity="0.4" transform="rotate(-15 670 645)"/>

    <!-- Water highlights near kayak/reflection -->
    <circle cx="590" cy="650" r="3" fill="white" opacity="0.7"/>
    <circle cx="580" cy="680" r="2" fill="white" opacity="0.6"/>
    <rect x="540" y="600" width="5" height="15" fill="white" opacity="0.4" transform="rotate(5 540 600)"/>
    <rect x="550" y="700" width="8" height="20" fill="#F0A060" opacity="0.3" transform="rotate(-10 550 700)"/>

    <!-- Paddle highlights -->
    <rect x="535" y="632" width="10" height="2" fill="white" opacity="0.8" transform="rotate(-15 535 632)"/>
    <rect x="655" y="627" width="10" height="2" fill="white" opacity="0.7" transform="rotate(-15 655 627)"/>
  </g>

</svg>